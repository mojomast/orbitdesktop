<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes live tools</title><style>html{color-scheme:dark;background:transparent}*{box-sizing:border-box}body{margin:0;padding:16px;height:100vh;display:flex;flex-direction:column;color:#e4f9f6;background:transparent;font:12px system-ui;text-shadow:0 1px 4px #000}header,.controls{display:flex;gap:8px;align-items:center}header{font-size:11px;letter-spacing:2px}button{background:#13233280;border:1px solid #8eeed333;color:inherit;border-radius:6px;padding:4px 8px;cursor:pointer}#pause{margin-left:auto}#status,footer{font-size:10px;color:#b6cbd9;margin:10px 0}#summary{padding:8px 0;color:#79eddb}.controls{margin-bottom:8px}#log{overflow:auto;flex:1;min-height:0;overflow-anchor:none}article{padding:10px 0;border-top:1px solid #ffffff18}strong{font-family:monospace;color:#79eddb;font-weight:500}.state{float:right}small{display:block;color:#aec0d4;font-size:10px;margin-top:5px}.failed{color:#ffb5ad}.description{margin-top:5px;color:#d0e4ec}footer{margin-bottom:0}</style><header>HERMES / LIVE TOOLS<button id="pause">Pause</button></header><div id="status" role="status">Waiting for desktop connection.</div><div id="summary"></div><div class="controls"><label><input id="follow" type="checkbox" checked> Auto-scroll</label><button id="latest">Jump to latest</button></div><main id="log" role="log" aria-label="Live tool calls"></main><footer>Open Orbit chats · bounded event history<br>Descriptions indicate tool purpose, not private arguments or results.</footer><script>
const $=id=>document.getElementById(id);let paused=false,last=null,seen=0,signature='';
function purpose(name){const n=name.split('.').pop();return ({terminal:'Runs a command, script, build, or system check.',read_file:'Reads a file to gather context.',search_files:'Searches project files or their contents.',write_file:'Creates or replaces a file.',patch:'Applies targeted edits to existing files.',web_search:'Searches the web for information.',web_extract:'Extracts content from web pages.',browser_navigate:'Opens a page in the browser.',browser_click:'Interacts with a page control.',browser_snapshot:'Inspects page structure and controls.',browser_console:'Checks browser state or JavaScript diagnostics.',browser_vision:'Inspects the rendered page.',process:'Monitors or manages a running process.',parallel:'Runs independent tool operations concurrently.'})[n]||'Performs a '+n.replaceAll('_',' ')+' operation.'}
function calls(events){const rows=[];for(const e of events){if(e.event==='tool.started')rows.push({...e,start:e.timestamp,running:true});else{const r=rows.find(r=>r.running&&r.tool===e.tool);if(r){Object.assign(r,e,{running:false});}else rows.push({...e,running:false});}}return rows}
function bottom(){$('log').scrollTop=$('log').scrollHeight}
function render(d){$('status').textContent=d.status;const rows=calls(d.events);const running=rows.filter(r=>r.running).length,failed=rows.filter(r=>!r.running&&r.error).length; $('summary').textContent=running+' active · '+(rows.length-running-failed)+' completed · '+failed+' failed (retained history)';const sig=JSON.stringify(d.events);if(sig!==signature){signature=sig;const scroll=$('log').scrollTop;$('log').replaceChildren(...rows.map(e=>{const row=document.createElement('article'),name=document.createElement('strong'),state=document.createElement('span'),desc=document.createElement('div'),time=document.createElement('small');name.textContent=e.tool;state.className='state'+(e.error?' failed':'');state.textContent=e.running?'● Running':e.error?'✕ Failed':'✓ Finished';desc.className='description';desc.textContent=purpose(e.tool);time.textContent=new Date((e.start??e.timestamp)*1000).toLocaleTimeString()+' · ';if(e.running){time.dataset.start=String(e.start);time.dataset.prefix=time.textContent;}else time.textContent+=(e.duration!==undefined?e.duration.toFixed(2)+'s':e.start!==undefined?Math.max(0,e.timestamp-e.start).toFixed(2)+'s (observed)':'Duration unavailable');row.append(name,state,desc,time);return row}));if($('follow').checked)bottom();else $('log').scrollTop=scroll;}tick()}
function tick(){if(paused)return;document.querySelectorAll('[data-start]').forEach(el=>el.textContent=el.dataset.prefix+Math.max(0,Date.now()/1000-Number(el.dataset.start)).toFixed(1)+'s elapsed');}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.type!=='orbit:tool-feed'||!Array.isArray(e.data.events))return;last=e.data;seen=Date.now();if(!paused)render(last)});
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(!paused&&last)render(last);if(paused)$('status').textContent='Display paused · tools continue running'};
$('latest').onclick=()=>{$('follow').checked=true;bottom()};$('follow').onchange=()=>{if($('follow').checked)bottom()};
setInterval(()=>{tick();if(seen&&Date.now()-seen>10000&&!paused)$('status').textContent='Desktop disconnected · awaiting updates'},500);
</script></html>
