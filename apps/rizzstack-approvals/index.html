<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rizzstack approvals</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0d0f14; color: #d7dce6; }
.head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #232838; }
.head h1 { font-size: 14px; letter-spacing: 0.08em; margin: 0; }
.head button { margin-left: auto; }
button { background: #1a2030; color: #d7dce6; border: 1px solid #333c52; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.approve { border-color: #2f6b3f; color: #7fd79a; }
button.decline { border-color: #7a3b3b; color: #e08c8c; }
button:disabled { opacity: 0.45; cursor: default; }
#status { padding: 8px 20px; color: #8b93a7; }
.approval { margin: 12px 20px; padding: 14px 16px; border: 1px solid #232838; border-radius: 10px; background: #12161f; }
.approval-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.preview { font-weight: 600; }
.badge { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid #333c52; }
.badge.pending { color: #e8c268; }
.badge.approved { color: #7fd79a; }
.badge.declined { color: #e08c8c; }
.badge.expired { color: #e08c8c; }
.binding { margin-top: 6px; font-size: 12px; color: #8b93a7; }
.binding code { color: #b9c2d4; word-break: break-all; }
.when { margin-top: 4px; font-size: 12px; color: #8b93a7; }
.actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { flex: 1; min-width: 180px; background: #0d0f14; color: #d7dce6; border: 1px solid #333c52; border-radius: 6px; padding: 6px 10px; }
.result { margin-top: 8px; font-size: 13px; }
.result.error { color: #e08c8c; }
.result.ok { color: #7fd79a; }
.empty { margin: 24px 20px; color: #8b93a7; }
</style>
<script defer src="./app.js"></script>
</head>
<body>
<header class="head">
<h1>RIZZSTACK / APPROVALS</h1>
<button id="refresh" type="button">Refresh</button>
</header>
<p id="status" role="status" aria-live="polite">Loading pending approvals…</p>
<main id="approval-list" aria-label="Pending approvals"></main>
</body>
</html>
