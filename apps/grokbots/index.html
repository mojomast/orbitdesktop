<!doctype html><html><head><meta charset="utf-8"><meta name="orbit-builtin-app" content="grokbots@7"><title>Agents</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0d0f14;color:#e6e8ee;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
#app{display:flex;height:100%}
#side{width:240px;min-width:180px;border-right:1px solid #232733;display:flex;flex-direction:column;background:#11141b}
#side header{padding:10px;font-weight:600;display:flex;gap:6px;align-items:center}
#q{margin:0 10px 8px;padding:6px 8px;border-radius:6px;border:1px solid #2b3040;background:#0d0f14;color:inherit}
#list{overflow:auto;flex:1}
.sec{padding:8px 12px 4px;font-size:11px;text-transform:uppercase;color:#7b8299;cursor:pointer;user-select:none}
.bot{display:flex;gap:8px;padding:7px 10px;cursor:pointer;align-items:center;border-left:3px solid transparent}
.bot:hover{background:#181c26}.bot.sel{background:#1c2232;border-left-color:#6d8cff}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:12px;background:#2b3248;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.bm{min-width:0;flex:1}.bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bp{font-size:12px;color:#8a90a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none;animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}
.badge{background:#6d8cff;color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{padding:10px 14px;border-bottom:1px solid #232733;display:flex;align-items:center;gap:10px}#top .t{font-weight:600;flex:1}#st{font-size:12px;color:#8a90a6}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:#2c3d78}.m.assistant{align-self:flex-start;background:#1a1e29}.m.stream{opacity:.75;border:1px dashed #3b4256}
.m pre{background:#0a0c10;padding:8px;border-radius:6px;overflow:auto;white-space:pre}.m code{background:#0a0c10;padding:1px 4px;border-radius:4px}
.ts{font-size:10px;color:#6b7186;margin-top:3px}
#older{align-self:center}
#comp{display:flex;gap:8px;padding:10px;border-top:1px solid #232733}
#in{flex:1;resize:none;height:64px;padding:8px;border-radius:8px;border:1px solid #2b3040;background:#0d0f14;color:inherit;font:inherit}
button{background:#2b3248;color:inherit;border:1px solid #3b4256;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}button.pri{background:#4f6bf0;border-color:#4f6bf0}button:disabled{opacity:.5;cursor:default}
#err{color:#ff8a8a;font-size:12px;padding:0 14px}
.empty{margin:auto;color:#6b7186;text-align:center}
.grp{padding:10px 12px 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a9b4ff;display:flex;gap:6px;flex-wrap:wrap}.grp small{color:#ff8a8a;font-weight:400;text-transform:none}
.ses{padding:9px 14px;border-bottom:1px solid #1d212c;cursor:pointer}.ses:hover{background:#161a24}.ses .bn{font-weight:600}.ses .bp{font-size:12px;color:#8a90a6}
#picker{flex:1;overflow:auto;display:none}#picker .bar{display:flex;gap:8px;padding:10px 14px;align-items:center;border-bottom:1px solid #232733}
#act{width:300px;border-left:1px solid #232733;background:#10131a;display:none;flex-direction:column;min-width:0}#act.on{display:flex}
#act header{padding:10px 12px;font-weight:600;display:flex;gap:6px;align-items:center;border-bottom:1px solid #232733}#act header span{flex:1}
#actlist{flex:1;overflow:auto;padding:6px 0}#actmeta{font-size:11px;color:#7b8299;padding:6px 12px;border-top:1px solid #232733}
.ai{padding:6px 12px;border-bottom:1px solid #191d27;font-size:12px}.ai .h{display:flex;gap:6px;align-items:center}.ai .n{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai .d{color:#8a90a6;word-break:break-word;margin-top:2px;font-family:ui-monospace,monospace;font-size:11px}.ai .s{font-size:10px;padding:0 5px;border-radius:6px;background:#262b3a}
.s.pending,.s.working,.s.streaming,.s.running{background:#3b3413;color:#ffd666}.s.done,.s.completed,.s.sent{background:#15331f;color:#7ee2a0}.s.failed{background:#3a1717;color:#ff8a8a}.s.waiting{background:#3a2440;color:#f0a6ff}
#wk{font-size:12px;color:#ffd666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
</style></head><body><div id="app">
<div id="side"><header>🤖 Agents <span style="flex:1"></span><button id="rf" title="Refresh">⟳</button></header><input id="q" placeholder="Search agents"><div id="list"></div></div>
<div id="main"><div id="top"><button id="back" hidden>◂ Sessions</button><span class="t" id="title">Pick an agent</span><span id="wk"></span><span id="st"></span><button id="stop" hidden>Stop</button><button id="actbtn" title="Show live activity">⚡ Activity</button></div><div id="err"></div>
<div id="picker"></div><div id="msgs"><div class="empty">Select an agent on the left to see its conversation.</div></div>
<div id="comp"><textarea id="in" maxlength="100000" placeholder="Message… up to 100,000 characters (Enter to send, Shift+Enter for newline)" disabled></textarea><button class="pri" id="send" disabled>Send</button></div></div><div id="act"><header><span>Live activity</span><button id="actx">✕</button></header><div id="actlist"><div class="sec">No activity yet.</div></div><div id="actmeta"></div></div></div>
<script>
const hp=new URLSearchParams(location.hash.slice(1));const KEY=hp.get('k')||'';
const API=new URL('/api/grokbots-app',location.href).href;
const $=id=>document.getElementById(id);
const INTERNAL=/^(Orbit (chat|collab|shared chat)|Fork [0-9a-f]+|Hermes bridge|orbittest)$/;
let runSince=0,groups=[],sel=null,session=null,msgs=[],older=null,stream=null,fast=0,run=null,sending=false,openInternal={},picking=false,sesNext=null,sesList=[];
// sel = {profile, agent}; legacy #bot= means Grok Bot gateway agent
if(hp.get('p')&&hp.get('a'))sel={profile:hp.get('p'),agent:hp.get('a')};else if(hp.get('bot'))sel={profile:'grok',agent:hp.get('bot')};
session=hp.get('s')||null;
async function api(b){const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({error:'HTTP '+r.status}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
function err(e){$('err').textContent=e?String(e.message||e):''}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s){return esc(s).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>'<pre>'+c+'</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
function av(b){const d=document.createElement('div');d.className='av';if(b.avatar){const i=new Image();i.src=b.avatar;d.append(i)}else{d.textContent=(b.name.match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase();if(b.color)d.style.background=b.color}return d}
const group=()=>sel&&groups.find(g=>g.profile===sel.profile);
const cur=()=>{const g=group();return g&&g.agents.find(a=>a.id===sel.agent)};
const isSes=()=>{const g=group();return g?g.kind==='sessions':false};
function saveHash(){history.replaceState(null,'','#k='+encodeURIComponent(KEY)+(sel?'&p='+encodeURIComponent(sel.profile)+'&a='+encodeURIComponent(sel.agent):'')+(session?'&s='+encodeURIComponent(session):''))}
// Unread badge: counted locally (new finished turns since Kyle last viewed the chat), never the gateway unreadCount,
// which also grows from hidden/background turns and is only cleared by openAgent (a mutating call we avoid).
const SEEN_K='gb-seen-v1';let SEEN={};try{SEEN=JSON.parse(localStorage.getItem(SEEN_K)||'{}')||{}}catch{}
function seenSave(){try{localStorage.setItem(SEEN_K,JSON.stringify(SEEN))}catch{}}
function unseen(pid,b){const k=pid+':'+b.id,t=Number(b.updatedAt)||0;let e=SEEN[k];const viewing=sel&&sel.profile===pid&&sel.agent===b.id;
 if(!e||viewing){if(!e||e.at!==t||e.n){SEEN[k]={at:t,n:0};seenSave()}return 0}
 if(t>e.at&&!b.running){e.at=t;e.n=Math.min(99,(e.n||0)+1);seenSave()}return e.n||0}
function renderList(){const q=$('q').value.toLowerCase();const L=$('list');L.textContent='';
 const titles={};for(const g of groups){const t=g.kind==='gateway'?(g.providerLabel==='Grok Bot'?'Grok Bots':g.providerLabel+' agents'):(g.provider==='hermes'?'Hermes profiles':g.providerLabel+' profiles');(titles[t]=titles[t]||[]).push(g)}
 for(const [t,gs] of Object.entries(titles)){const h=document.createElement('div');h.className='grp';h.textContent=t;const errs=gs.filter(g=>g.error);if(errs.length){const e=document.createElement('small');e.textContent='⚠ '+errs[0].error;h.append(e)}L.append(h);
  for(const g of gs){const f=g.agents.filter(b=>!q||b.name.toLowerCase().includes(q)).sort((a,b)=>b.updatedAt-a.updatedAt);
   const row=b=>{const r=document.createElement('div');r.className='bot'+(sel&&sel.profile===g.profile&&sel.agent===b.id?' sel':'');r.title=b.id;r.append(av(b));const m=document.createElement('div');m.className='bm';m.innerHTML='<div class="bn"></div><div class="bp"></div>';m.firstChild.textContent=b.name;m.lastChild.textContent=b.preview||b.description||'';r.append(m);
    if(b.running){const d=document.createElement('span');d.className='dot';r.append(d)}else{const n=unseen(g.profile,b);if(n){const u=document.createElement('span');u.className='badge';u.textContent=n;r.append(u)}}
    r.onclick=()=>pick(g.profile,b.id);L.append(r)};
   const main=g.kind==='gateway'?f.filter(b=>!INTERNAL.test(b.name)):f,internal=g.kind==='gateway'?f.filter(b=>INTERNAL.test(b.name)):[];
   main.forEach(row);
   if(internal.length){const s=document.createElement('div');s.className='sec';s.textContent=(openInternal[g.profile]?'▾ ':'▸ ')+'Orbit internal ('+internal.length+')';s.onclick=()=>{openInternal[g.profile]=!openInternal[g.profile];renderList()};L.append(s);if(openInternal[g.profile])internal.forEach(row)}}}
 if(!groups.length)L.innerHTML='<div class="sec">No providers configured</div>'}
function renderMsgs(keep){const M=$('msgs');const atBottom=M.scrollHeight-M.scrollTop-M.clientHeight<60;const prevH=M.scrollHeight;M.textContent='';
 if(older){const b=document.createElement('button');b.id='older';b.textContent='Load older';b.onclick=loadOlder;M.append(b)}
 if(!msgs.length&&!stream)M.innerHTML+='<div class="empty">'+(isSes()&&!session?'New conversation — send a message to start it.':'No messages yet.')+'</div>';
 if(window.gbToolCards)gbToolCards(M,'');
 for(const m of msgs){const d=document.createElement('div');d.className='m '+m.role;d.innerHTML=md(m.content);d._m=m;if(m.attachments&&m.attachments.length){const a=document.createElement('div');a.className='matt';a.textContent='📎 '+m.attachments.map(x=>x.name).join(', ');d.append(a)}if(m.ts){const t=document.createElement('div');t.className='ts';t.textContent=new Date(m.ts).toLocaleString()+(m.state==='sending'?' · sending…':m.state==='delivered'?' · ✓ delivered':m.state==='failed'?' · ⚠ not delivered':'');if(m.state==='failed'){t.style.color='#ff8a8a';t.title=m.error||'';const rb=document.createElement('button');rb.textContent='Retry';rb.style.marginLeft='8px';rb.onclick=()=>retry(m);t.append(rb)}d.append(t)}M.append(d);if(window.gbToolCards&&m.id&&!String(m.id).startsWith('local-'))gbToolCards(M,m.id)}
 if(stream){const d=document.createElement('div');d.className='m assistant stream';d.innerHTML=md(stream);M.append(d)}
 if(keep==='top')M.scrollTop=M.scrollHeight-prevH;else if(keep!=='stay'||atBottom)M.scrollTop=M.scrollHeight}
function showPicker(on){picking=on;$('picker').style.display=on?'block':'none';$('msgs').style.display=on?'none':'flex';$('comp').style.display=on?'none':'flex'}
function renderTop(){const b=cur();const sesTitle=session&&sesList.find(x=>x.id===session);
 $('title').textContent=(b?b.name:(sel?sel.agent:'Pick an agent'))+(isSes()&&!picking?' — '+(session?(sesTitle?sesTitle.title:session):'new conversation'):'');
 const busy=(b&&b.running&&!isSes())||!!run;$('st').textContent=sending?'sending…':busy?'working…':b&&b.awaiting?'waiting for you':'';
 $('stop').hidden=!busy||picking;$('back').hidden=!(isSes()&&!picking);$('in').disabled=!sel||picking;$('send').disabled=!sel||sending||picking||!!run}
async function loadAgents(){try{groups=(await api({action:'agents'})).groups;err();renderList();renderTop()}catch(e){err(e)}}
async function loadSessions(more){const g=group();if(!g)return;const P=$('picker');
 if(!more){sesList=[];sesNext=null;P.innerHTML='<div class="empty" style="padding:20px">Loading conversations…</div>'}
 try{const r=await api({action:'sessions',profile:g.profile,offset:more?sesNext:0});sesList=sesList.concat(r.sessions);sesNext=r.next;
  P.textContent='';const bar=document.createElement('div');bar.className='bar';bar.innerHTML='<b style="flex:1"></b>';bar.firstChild.textContent=sesList.length+' conversations · '+(cur()?.name||g.label);const nb=document.createElement('button');nb.className='pri';nb.textContent='+ New conversation';nb.onclick=()=>openSession(null);bar.append(nb);P.append(bar);
  for(const s of sesList){const d=document.createElement('div');d.className='ses';d.innerHTML='<div class="bn"></div><div class="bp"></div>';d.firstChild.textContent=s.title;d.lastChild.textContent=[s.updatedAt?new Date(s.updatedAt).toLocaleString():'',s.messages+' msgs',s.source,s.preview&&s.preview!==s.title?s.preview:''].filter(Boolean).join(' · ');d.onclick=()=>openSession(s.id);P.append(d)}
  if(!sesList.length)P.innerHTML+='<div class="empty" style="padding:20px">No previous conversations.</div>';
  if(sesNext!=null){const m=document.createElement('button');m.textContent='Load more';m.style.margin='10px';m.onclick=()=>loadSessions(true);P.append(m)}err()}catch(e){err(e);P.innerHTML='<div class="empty" style="padding:20px">Could not load conversations.</div>'}}
function openSession(id){session=id;msgs=[];older=null;stream=null;run=null;saveHash();showPicker(false);renderTop();if(id){$('msgs').innerHTML='<div class="empty">Loading…</div>';loadHist(true)}else renderMsgs()}
function hargs(extra){return {action:'history',profile:sel.profile,agent:sel.agent,...(session?{session}:{}),...extra}}
async function loadHist(first,merge){if(!sel||picking||(isSes()&&!session))return;const key=JSON.stringify([sel,session]);try{const h=await api(hargs({}));if(key!==JSON.stringify([sel,session]))return;
 if(first&&window.gbToolsIn)gbToolsIn(h.tools,!merge);
 if(first){const srv=h.messages;const loc=merge?msgs.filter(m=>String(m.id).startsWith('local-')&&!srv.some(x=>x.role===m.role&&x.content.trim()===m.content.trim())&&(m.state==='failed'||m.state==='sending'||!srv.some(x=>x.role==='user'&&x.ts>=m.ts-60000))):[];msgs=srv.concat(loc);if(!merge)older=h.before}else{const known=new Set(msgs.map(m=>m.id));const add=h.messages.filter(m=>!known.has(m.id));const changed=add.length||(h.streaming||null)!==stream||(window.gbToolsIn&&gbToolsIn(h.tools,false));msgs=msgs.concat(add).filter((m,i,a)=>!(m.id.startsWith('local-')&&a.some(x=>!x.id.startsWith('local-')&&x.role===m.role&&x.content.trim()===m.content.trim())));if(!changed)return}
 stream=h.streaming;renderMsgs(first?'bottom':'stay');err()}catch(e){err(e)}}
async function loadOlder(){if(!older)return;try{const h=await api(hargs({before:older}));if(window.gbToolsIn)gbToolsIn(h.tools,false);const known=new Set(msgs.map(m=>m.id));msgs=h.messages.filter(m=>!known.has(m.id)).concat(msgs);older=h.before;renderMsgs('top')}catch(e){err(e)}}
function pick(profile,agent){sel={profile,agent};session=null;msgs=[];if(window.gbToolsIn)gbToolsIn([],true);older=null;stream=null;run=null;saveHash();renderList();
 if(isSes()){showPicker(true);renderTop();loadSessions(false)}else{showPicker(false);renderTop();$('msgs').innerHTML='<div class="empty">Loading…</div>';loadHist(true)}}
function nonce(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g,'')}
async function deliver(m){m.state='sending';renderMsgs();sending=true;renderTop();
 try{const r=await api({action:'send',profile:sel.profile,agent:sel.agent,...(m.session?{session:m.session}:{}),prompt:m.content,nonce:m.nonce,...(m.attachments&&m.attachments.length?{attachments:m.attachments.map(a=>({id:a.id}))}:{}),...(window.gbSendExtras?gbSendExtras():{})});
  m.state='delivered';if(r.session&&r.session!==session){session=r.session;saveHash()}m.session=session;if(r.run){run=r.run;runSince=Date.now();stream='…'}
  fast=Date.now()+180000;err()}catch(e){m.state='failed';m.error=e.message;err(e)}finally{sending=false;renderMsgs();renderTop()}}
async function doSend(){const t=$('in').value.trim();const hasAtt=!!(window.gbPendingAttachments&&gbPendingAttachments().length);if((!t&&!hasAtt)||!sel||sending||run)return;if(window.gbAttachBusy&&gbAttachBusy()){err('Wait for the uploads to finish.');return}$('in').value='';const att=hasAtt?gbTakeAttachments():null;
 const m={id:'local-'+Date.now(),role:'user',content:t,ts:Date.now(),nonce:nonce(),session,...(att?{attachments:att}:{})};msgs.push(m);await deliver(m)}
function retry(m){if(sending||run)return;if(m.session===undefined)m.session=session;deliver(m)}
// After a run ends, every assistant message of the turn comes from session history (not only the run's final output).
async function settleRun(r,fin){run=null;stream=null;renderTop();
 const before=msgs.filter(m=>m.role==='assistant'&&!String(m.id).startsWith('local-')).length;
 for(const wait of [0,1500,4000]){if(wait)await new Promise(z=>setTimeout(z,wait));await loadHist(true,true);
  if(msgs.filter(m=>m.role==='assistant'&&!String(m.id).startsWith('local-')).length>before)break}
 const got=msgs.filter(m=>m.role==='assistant'&&!String(m.id).startsWith('local-')).length>before;
 if(!got&&fin==='completed'&&r.output){msgs.push({id:'local-r'+Date.now(),role:'assistant',content:r.output,ts:Date.now()});renderMsgs()}
 if(fin!=='completed')err(Error('Run '+fin+(r.error?': '+r.error:'')))}
var pollRun=async function(){if(!run||!sel)return;try{const r=await api({action:'run',profile:sel.profile,run,session});
 if(r.session&&r.session!==session){session=r.session;saveHash()}
 if(['completed','failed','cancelled','interrupted','expired'].includes(r.status))await settleRun(r,r.status);
 else{stream=r.output||(r.status==='waiting_for_approval'?'Waiting for a tool approval (resolve it in Orbit\'s agent chat).':'…');renderMsgs('stay');
  if(Date.now()-runSince>3000)loadHist(false)}}catch(e){err(e)}}
$('send').onclick=doSend;$('in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}};
$('q').oninput=renderList;$('rf').onclick=()=>{loadAgents();if(picking)loadSessions(false);else loadHist(true)};
$('back').onclick=()=>{session=null;run=null;saveHash();showPicker(true);renderTop();loadSessions(false)};
$('stop').onclick=async()=>{try{await api(run?{action:'stop',profile:sel.profile,run}:{action:'stop',profile:sel.profile,agent:sel.agent});loadAgents()}catch(e){err(e)}};
async function tick(){if(run)await pollRun();else if(sel&&!picking)await loadHist(false);const b=cur();setTimeout(tick,run||(b&&b.running)||Date.now()<fast?1500:6000)}
async function listLoop(){await loadAgents();const b=cur();setTimeout(listLoop,(b&&b.running)||Date.now()<fast?3000:10000)}
if(!KEY){err('No app key in the pane URL. Ask your agent to reopen this pane.')}else{(async()=>{await loadAgents();setTimeout(listLoop,10000);
 if(sel){if(isSes()){if(session){await loadSessions(false);openSession(session)}else{showPicker(true);renderTop();loadSessions(false)}}else{renderList();renderTop();loadHist(true)}}
 setTimeout(tick,2000)})()}

// ---- live activity -------------------------------------------------------
let actOn=false,actItems=new Map(),actCursor=0,actKey='',actInfo=null,hermesAct=[];
const ICON={subagent:'◈',tool:'🔧',step:'•',state:'◉','needs-input':'✋',progress:'📋'};
const fmtDur=ms=>ms==null?'':ms<1000?ms+'ms':ms<60000?(ms/1000).toFixed(1)+'s':Math.floor(ms/60000)+'m'+Math.round(ms%60000/1000)+'s';
function actRow(i){const d=document.createElement('div');d.className='ai';const h=document.createElement('div');h.className='h';
  const n=document.createElement('span');n.className='n';n.textContent=(ICON[i.type]||'•')+' '+i.title;const st=document.createElement('span');st.className='s '+String(i.status).replace(/[^a-z-]/gi,'');st.textContent=i.status;
  const du=document.createElement('span');du.className='s';du.textContent=i.durationMs!=null?fmtDur(i.durationMs):(/pending|working|streaming|running/.test(i.status)?fmtDur(Date.now()-i.ts)+'…':'');
  h.append(n,st);if(du.textContent)h.append(du);d.append(h);
  if(i.detail){const x=document.createElement('div');x.className='d';x.textContent=i.detail;d.append(x)}
  const t=document.createElement('div');t.className='d';t.style.fontSize='10px';t.textContent=new Date(i.ts).toLocaleTimeString();d.append(t);return d}
function renderAct(){const L=$('actlist');L.textContent='';const g=group();
 if(g&&g.kind==='gateway'&&actInfo&&actInfo.state&&actInfo.state.subagent){const h=document.createElement('div');h.className='sec';h.style.color='#f0a6ff';h.textContent='A subagent is working — its tool calls are not visible here.';L.append(h)}
 const sb=g&&g.kind==='gateway'&&actInfo&&actInfo.subagents;
 if(sb&&(sb.agents.length||sb.history.length)){const box=document.createElement('div');box.style.borderBottom='2px solid #232733';

(function(){
const st=document.createElement('style');st.textContent=`#lib{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50}#lib.on{display:flex}#libbox{width:min(760px,94vw);height:min(620px,90vh);background:#141822;border:1px solid #2b3248;border-radius:12px;display:flex;flex-direction:column}#libbox header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #232733;font-weight:600}#libbox header span{flex:1}#libq{margin:8px 12px;padding:6px 8px}#librows{flex:1;overflow:auto;padding:0 6px}.lr{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px}.lr:hover{background:#1a1e29}.lr .lm{flex:1;min-width:0}.lr .lt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr .lp{font-size:11px;color:#8b93a7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lr button{font-size:11px;padding:3px 7px}#libfoot{padding:8px 12px;border-top:1px solid #232733;font-size:11px;color:#8b93a7;display:flex;gap:8px;align-items:center}#libfoot span{flex:1}`;document.head.append(st);
const lib=document.createElement('div');lib.id='lib';lib.innerHTML='<div id="libbox" role="dialog" aria-label="Conversation library"><header><span>📚 Conversation library</span><button id="libx">✕</button></header><input id="libq" type="search" placeholder="Search bots, conversations and previews…"><div id="librows"></div><div id="libfoot"><span id="libst"></span><button id="libmore">Search older sessions</button></div></div>';document.body.append(lib);
const btn=document.createElement('button');btn.id='libbtn';btn.title='Conversation library: search, open in a new window, export';btn.textContent='📚';$('rf').before(btn);
const ses={};// profile -> {rows,next}
const label=g=>g.kind==='gateway'?(g.providerLabel||'Gateway'):(g.providerLabel||'Hermes');
function rows(){const out=[];for(const g of groups){if(g.kind==='sessions'){const a=g.agents[0];if(!a)continue;for(const x of (ses[g.profile]&&ses[g.profile].rows)||[])out.push({profile:g.profile,agent:a.id,session:x.id,title:x.title,preview:x.preview,src:label(g)+' · '+a.name,at:x.updatedAt,n:x.messages})}
  else for(const a of g.agents)out.push({profile:g.profile,agent:a.id,title:a.name,preview:a.preview||a.description,src:label(g),at:a.updatedAt})}return out.sort((x,y)=>(y.at||0)-(x.at||0))}
async function loadSes(more){for(const g of groups.filter(g=>g.kind==='sessions')){const c=ses[g.profile]||(ses[g.profile]={rows:[],next:0});if(c.next===null||(!more&&c.rows.length))continue;try{const r=await api({action:'sessions',profile:g.profile,offset:c.next||0});c.rows=c.rows.concat(r.sessions.filter(x=>!c.rows.some(y=>y.id===x.id)));c.next=r.next}catch(e){c.error=e.message;c.next=null}}render()}
function render(){const q=$('libq').value.trim().toLowerCase();const R=$('librows');R.textContent='';const list=rows().filter(r=>!q||[r.title,r.preview,r.src,r.session||r.agent].join(' ').toLowerCase().includes(q));
  for(const r of list.slice(0,400)){const d=document.createElement('div');d.className='lr';const m=document.createElement('div');m.className='lm';const t=document.createElement('div');t.className='lt';t.textContent=r.title||r.session||r.agent;const p=document.createElement('div');p.className='lp';p.textContent=[r.src,r.at?new Date(r.at).toLocaleString():'',r.n?r.n+' messages':'',r.preview].filter(Boolean).join(' · ');m.append(t,p);
    const o=document.createElement('button');o.textContent='Open';o.onclick=()=>openHere(r);const w=document.createElement('button');w.textContent='New window';w.title='Open in its own Orbit window';w.onclick=()=>openWindow(r);w.disabled=!(window.HOST&&HOST.ready);if(w.disabled)w.title='Available when Grok Bots runs inside Orbit';
    const em=document.createElement('button');em.textContent='⤓ .md';em.title='Export as Markdown';em.onclick=()=>exportConv(r,'md',em);const ej=document.createElement('button');ej.textContent='⤓ .json';ej.title='Export as JSON (messages and tool calls)';ej.onclick=()=>exportConv(r,'json',ej);
    m.ondblclick=()=>openHere(r);d.append(m,o,w,em,ej);R.append(d)}
  if(!list.length)R.innerHTML='<div class="sec">No matching conversations'+(more()?' yet — try “Search older sessions”.':'.')+'</div>';
  const errs=Object.values(ses).filter(c=>c.error).map(c=>c.error);$('libst').textContent=list.length+' conversation'+(list.length===1?'':'s')+(errs.length?' · ⚠ '+errs[0]:'');$('libmore').disabled=!more()}
const more=()=>Object.values(ses).some(c=>c.next);
function close(){lib.classList.remove('on')}
function openHere(r){close();pick(r.profile,r.agent);if(r.session)openSession(r.session)}
async function openWindow(r){try{await host('open',{profile:r.profile,agent:r.agent,session:r.session||'',newWindow:true});close()}catch(e){err(e)}}
window.gbOpenWindow=openWindow;
async function fetchAll(r){const msgs=[],tools=[];let before=undefined;for(let i=0;i<25;i++){const h=await api({action:'history',profile:r.profile,agent:r.agent,...(r.session?{session:r.session}:{}),...(before?{before}:{})});
  const known=new Set(msgs.map(m=>m.id));msgs.unshift(...h.messages.filter(m=>!known.has(m.id)));for(const t of h.tools||[])if(!tools.some(x=>x.id===t.id))tools.push(t);if(!h.before||h.before===before)break;before=h.before}return {msgs,tools}}
const slug=s=>String(s||'conversation').replace(/[^A-Za-z0-9 _-]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'conversation';
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function exportConv(r,fmt,b){const old=b.textContent;b.textContent='…';b.disabled=true;try{const {msgs,tools}=await fetchAll(r);const stamp=new Date().toISOString();
  if(fmt==='json')download(slug(r.title)+'.json','application/json',JSON.stringify({exportedAt:stamp,source:r.src,profile:r.profile,agent:r.agent,session:r.session||null,title:r.title,messages:msgs,tools},null,2));
  else{const lines=[`# ${r.title||r.agent}`,'',`_${r.src} · exported ${new Date(stamp).toLocaleString()} · ${msgs.length} messages_`,''];const byAfter=new Map();for(const t of tools){const k=t.after||'';(byAfter.get(k)||byAfter.set(k,[]).get(k)).push(t)}
    const toolMd=k=>(byAfter.get(k)||[]).map(t=>`> 🔧 \`${t.name}\` — ${t.status}${t.input?`\n> input: ${t.input.slice(0,300).replace(/\n/g,' ')}`:''}`).join('\n');
    if(byAfter.get(''))lines.push(toolMd(''),'');
    for(const m of msgs){lines.push(`## ${m.role==='user'?'You':'Assistant'}${m.ts?` · ${new Date(m.ts).toLocaleString()}`:''}`,'',m.content,'');if(byAfter.get(m.id))lines.push(toolMd(m.id),'')}
    download(slug(r.title)+'.md','text/markdown',lines.join('\n'))}
  if(window.toast)toast('Exported '+msgs.length+' messages')}catch(e){err(e)}finally{b.textContent=old;b.disabled=false}}
const xb=document.createElement('button');xb.id='expbtn';xb.textContent='⤓';xb.title='Export this conversation as Markdown (Shift-click for JSON)';xb.onclick=e=>window.gbExport(e.shiftKey?'json':'md');$('actbtn').before(xb);
window.gbExport=(fmt)=>{if(!sel)return;const b=cur();exportConv({profile:sel.profile,agent:sel.agent,session:session||undefined,title:b?b.name:sel.agent,src:''},fmt,{textContent:'',disabled:false})};
btn.onclick=()=>{lib.classList.add('on');render();loadSes(false);$('libq').focus()};
$('libx').onclick=close;lib.onclick=e=>{if(e.target===lib)close()};$('libq').oninput=render;$('libmore').onclick=()=>loadSes(true);
addEventListener('keydown',e=>{if(e.key==='Escape'&&lib.classList.contains('on'))close();if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();btn.click()}});
})();
</script>
</body></html>
