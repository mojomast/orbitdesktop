<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes token telemetry</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at top right,#25345a,#101222 70%);color:#e8f2ff;font:13px system-ui;min-height:100vh}header{display:flex;align-items:center;gap:8px;letter-spacing:2px;font-size:11px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#54e6c6;box-shadow:0 0 14px #54e6c6}select{margin-left:auto;background:#191f36;color:#acbdd6;border:1px solid #35425c;border-radius:6px;padding:4px;font:11px system-ui}#total{font-size:39px;letter-spacing:-1.5px;font-weight:650;margin-top:15px;font-variant-numeric:tabular-nums}.label{color:#90a5be;font-size:11px}.bar{display:flex;height:5px;background:#26314a;border-radius:8px;overflow:hidden;margin:14px 0}.bar span:first-child{background:#65dfd0}.bar span:last-child{background:#ad8bff}main{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.value{font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}.input{color:#65dfd0}.output{color:#bd9fff}footer{border-top:1px solid #ffffff14;margin-top:15px;padding-top:10px;color:#8da0b9;font-size:10px;line-height:1.6}#status{color:#65dfd0}button{border:0;background:none;color:#99afd0;cursor:pointer;float:right;font-size:11px}button:hover{color:white}
/* Transparent desktop telemetry: no card surface, only readable floating text. */
html,body{background:transparent!important;background-image:none!important}
body{text-shadow:0 1px 3px #000,0 0 9px #080c20aa}
select{background:transparent;border-color:transparent;color:#d4e3f5;text-shadow:0 1px 3px #000}
select:hover,select:focus{border-color:#ffffff40}
select option{background:#101222;color:#e8f2ff}
footer{border-top:0}.label,footer{color:#c0cfe2}
body{padding:12px;display:grid;align-content:end;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}section{min-width:0}header{letter-spacing:1px;flex-wrap:wrap}#total,#oc-total{font-size:32px;margin-top:12px;font-weight:650}details{margin-top:12px;font-size:11px}summary{cursor:pointer;color:#d5c2ff}.models{max-height:165px;overflow:auto;margin-top:8px}.model{padding:6px 0;border-top:1px solid #ffffff20;overflow-wrap:anywhere}.model span{display:block;color:#c0cfe2;font-size:10px}footer{clear:both}@media(max-width:450px){body{grid-template-columns:1fr;gap:24px}} 
.usage-controls{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;letter-spacing:0;font-weight:400}.usage-controls select{margin:0;min-width:0}.scope-label{font:11px system-ui;padding:5px;color:#d4e3f5}.period-note{font-size:10px}
</style><header><span class="dot"></span>HERMES / TOKENS<select id="scope" aria-label="Usage scope"><option value="profile">All profiles</option><option value="orbit">Orbit chats</option></select></header><div id="total">—</div><div class="label">RECORDED TOKENS · ALL TIME</div><div class="bar"><span id="inbar"></span><span id="outbar"></span></div><main><div><div class="label">Input</div><div class="value input" id="input">—</div></div><div><div class="label">Output</div><div class="value output" id="output">—</div></div><div><div class="label">Cache reads *</div><div class="value" id="cached">—</div></div><div><div class="label">API calls</div><div class="value" id="calls">—</div></div></main><footer><button id="refresh" aria-label="Refresh usage">↻ Refresh</button><span id="status">Connecting…</span><br><span id="sessions">—</span> · saved counters, not live billing<br>* Reported separately; not added to total.</footer><script>
</script><script src="./meter.js">
</script></html>
