<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes token telemetry</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at top right,#25345a,#101222 70%);color:#e8f2ff;font:13px system-ui;min-height:100vh}header{display:flex;align-items:center;gap:8px;letter-spacing:2px;font-size:11px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#54e6c6;box-shadow:0 0 14px #54e6c6}select{margin-left:auto;background:#191f36;color:#acbdd6;border:1px solid #35425c;border-radius:6px;padding:4px;font:11px system-ui}#total{font-size:39px;letter-spacing:-1.5px;font-weight:650;margin-top:15px;font-variant-numeric:tabular-nums}.label{color:#90a5be;font-size:11px}.bar{display:flex;height:5px;background:#26314a;border-radius:8px;overflow:hidden;margin:14px 0}.bar span:first-child{background:#65dfd0}.bar span:last-child{background:#ad8bff}main{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.value{font-size:18px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}.input{color:#65dfd0}.output{color:#bd9fff}footer{border-top:1px solid #ffffff14;margin-top:15px;padding-top:10px;color:#8da0b9;font-size:10px;line-height:1.6}#status{color:#65dfd0}button{border:0;background:none;color:#99afd0;cursor:pointer;float:right;font-size:11px}button:hover{color:white}
</style><header><span class="dot"></span>HERMES / TOKENS<select id="scope" aria-label="Usage scope"><option value="orbit">Orbit chats</option><option value="profile">Whole profile</option></select></header><div id="total">—</div><div class="label">RECORDED TOKENS · ALL TIME</div><div class="bar"><span id="inbar"></span><span id="outbar"></span></div><main><div><div class="label">Input</div><div class="value input" id="input">—</div></div><div><div class="label">Output</div><div class="value output" id="output">—</div></div><div><div class="label">Cache reads *</div><div class="value" id="cached">—</div></div><div><div class="label">API calls</div><div class="value" id="calls">—</div></div></main><footer><button id="refresh" aria-label="Refresh usage">↻ Refresh</button><span id="status">Connecting…</span><br><span id="sessions">—</span> · saved counters, not live billing<br>* Reported separately; not added to total.</footer><script>
let data;const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat().format(n);function render(){if(!data)return;const d=data[$('scope').value];const total=d.input+d.output;$('total').textContent=fmt(total);for(const k of ['input','output','cached','calls'])$(k).textContent=fmt(d[k]);$('inbar').style.width=(total?100*d.input/total:0)+'%';$('outbar').style.width=(total?100*d.output/total:0)+'%';$('sessions').textContent=fmt(d.sessions)+' sessions';const age=Math.max(0,Math.floor(Date.now()/1000-data.updated_at));$('status').textContent=age>60?'Stale · '+age+'s old':'Updated '+new Date(data.updated_at*1000).toLocaleTimeString();$('status').style.color=age>60?'#ffc878':'#65dfd0'}async function refresh(){try{const r=await fetch('./usage.json?t='+Date.now(),{cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();render()}catch(e){$('status').textContent='Usage unavailable · retrying';$('status').style.color='#ffc878'}}$('scope').onchange=render;$('refresh').onclick=refresh;refresh();setInterval(refresh,15000);
</script></html>
