<!doctype html><meta charset="utf-8"><title>Planet Remote</title><style>body{margin:0;background:#080e20;color:#eef5ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;overflow:hidden}main{text-align:center}h1{font-size:34px}#planet{width:220px;height:220px;border-radius:50%;margin:50px auto;background:radial-gradient(circle at 30% 25%,white,var(--color),#10152c 80%);box-shadow:0 0 80px var(--color);position:relative;animation:float 4s ease-in-out infinite}#planet:after{content:'';position:absolute;inset:80px -65px;border:12px solid var(--color);border-radius:50%;transform:rotate(-25deg);opacity:.6}small{color:#a9bad5} @keyframes float{50%{transform:translateY(-18px) rotate(5deg)}}</style><main><small>LINUX DESKTOP → ORBIT • LOCAL SIGNAL</small><h1 id="title">Planet Remote</h1><div id="planet"></div><p id="message">Waiting for your desktop transmission</p><small id="status"></small></main><script>let c={};try{c=JSON.parse(decodeURIComponent(location.hash.replace(/^#orbit-config=/,'')))}catch{}const colors={Aurora:'#72efbd',Nebula:'#b493ff',Solar:'#ffb457',Ocean:'#5fcfff'};document.documentElement.style.setProperty('--color',colors[c.theme]||colors.Aurora);document.querySelector('#message').textContent=c.message||'Waiting for your desktop transmission';document.querySelector('#title').textContent=(c.theme||'Aurora')+' planet';document.querySelector('#planet').style.width=document.querySelector('#planet').style.height=(Number(c.size)||220)+'px';document.querySelector('#status').textContent=c.sent?'Desktop signal received • '+c.sent:'Open Planet Remote on our shared desktop';</script>
