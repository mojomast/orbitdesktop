name: Orbit plugin tests
env:
  ONNXRUNTIME_NODE_INSTALL: skip
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    # A hung test must fail the job instead of holding a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Real-project acceptance reads exact files from the pinned baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Same tested Node as the Technology job. On 22.14.0,
          # tests/resource-content-verbs.test.mjs (oversized scene) never finishes.
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - name: Offline regression gate (isolated loopback, private home)
        run: bash scripts/ci-offline-check.sh
      - name: Rails HTTP and vendored source contracts
        run: |
          python3 tests/test_rails_vendor.py
          python3 -m unittest discover -s tests -p test_rails_http.py -v
      - run: python3 -m unittest discover -s tests -p test_hermes_plugin.py -v
      - run: python3 -m unittest discover -s tests -p test_normal_resource_retention.py -v
      - name: Widget schema and publisher parity
        run: |
          python3 tests/plugin-config-schema.test.py
          python3 tests/plugin-publish.test.py
          python3 tests/test_orbit_bundle.py

  ci-gate:
    name: ci-gate
    # The main ruleset requires this one check. It passes only when every job
    # in this file succeeded, so new jobs must be added to needs (checked below).
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: ci-gate needs every job in this file
        run: python3 .github/scripts/check_ci_gate.py .github/workflows/test.yml
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed or not results:
              print("ci-gate FAILED: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
