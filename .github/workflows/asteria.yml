name: Asteria simulator acceptance
on:
  push:
    paths: ['examples/plugins/asteria-mission-control/**', 'tests/asteria-*', '.github/workflows/asteria.yml', 'scripts/plugin_publish.py', 'server/workspace.mjs']
  pull_request:
    paths: ['examples/plugins/asteria-mission-control/**', 'tests/asteria-*', '.github/workflows/asteria.yml', 'scripts/plugin_publish.py', 'server/workspace.mjs']
  schedule:
    - cron: '27 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asteria-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      PLAYWRIGHT_BROWSERS_PATH: /tmp/opencode/asteria-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: mkdir -p /tmp/opencode
      - run: node --test tests/asteria-scenario.test.mjs
      - name: Install isolated browser tools
        run: |
          python3 -m venv /tmp/opencode/asteria-venv
          /tmp/opencode/asteria-venv/bin/pip install --disable-pip-version-check playwright==1.58.0
          /tmp/opencode/asteria-venv/bin/python -m playwright install --with-deps chromium
      - run: /tmp/opencode/asteria-venv/bin/python tests/asteria-simulator.browser.py
