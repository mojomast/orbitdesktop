name: orbit-desktop
version: "0.3.1"
description: Agent-shaped browser desktop with customizable workspaces, sandboxed apps and scoped control.
author: mojomast
homepage: https://github.com/mojomast/orbitdesktop
provides_tools:
  - orbit_workspace
  - orbit_workbench
  - orbit_resources
provides_hooks: []
provides_middleware: []
requires_env: []
config_schema:
  normal_resource_directory:
    type: str
    default: ""
    description: Profile-specific host-issued per-run channel directory for the exact pinned local Normal gateway. Contains no shared grant secret; never a model argument.
  resource_channel_file:
    type: str
    default: ""
    description: Host-issued private channel for a dedicated one-run local resource adapter only. Never configure in a shared Normal gateway profile.
  native_channel_file:
    type: str
    default: ""
    description: Private dedicated-attempt channel configuration, host supplied only.
  runtime_dir:
    type: str
    default: ""
    description: Absolute path to the running Orbit deployment's private .runtime directory.
  workspace_id:
    type: str
    default: ""
    description: Explicit workspace UUID to authorize for this Hermes profile.
  allow_mutations:
    type: bool
    default: false
    description: Allow revision-checked edits and checkpoints; restore also requires per-call confirmation.
